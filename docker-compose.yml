services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservation-network

  db:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - reservation-network

  phpmyadmin:
    image: phpmyadmin:5
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservation-network

volumes:
  mysql-data:

networks:
  reservation-network:
